server {
    listen 443 ssl;
    server_name webmcp-v2.tendrilsioservices.com;

    ssl_certificate /etc/lego-certs/certificates/webmcp.tendrilsioservices.com.crt;
    ssl_certificate_key /etc/lego-certs/certificates/webmcp.tendrilsioservices.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;
    }
}
server {
    listen 80;
    server_name webmcp-v2.tendrilsioservices.com;
    return 301 https://$host$request_uri;
}
